name: Energy Drink Scraper

on:
  schedule:
    - cron: '0 7 * * *'  # daily 07:00 UTC — seen.py expiry gate prevents redundant OCR/GPT spend
  workflow_dispatch:       # manual trigger from GitHub Actions UI

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to push state files back

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache EasyOCR models
        uses: actions/cache@v4
        with:
          path: ~/.EasyOCR
          key: easyocr-models-lt-en-v1

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # GitHub's free runners are 4 vCPU; EasyOCR already spreads one page
          # across all cores, so a few workers is the useful range.
          OCR_WORKERS: '3'
        run: python main.py --run-now

      - name: Save state files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add seen_catalogs.json 2>/dev/null || true
          git add deals.json 2>/dev/null || true
          git add store_history.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update seen catalogs"
          git push
